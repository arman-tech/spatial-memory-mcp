[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/arman-tech/spatial-memory-mcp"
publish = false

# Every third-party crate the build may use, pinned once here. Crates take them
# with `name.workspace = true`. Versions marked `=` are the ones SPEC section 15
# tested or the phase 0 spikes ran; changing one is a decision for
# docs/v3/DECISIONS.md, not a stream's choice.
[workspace.dependencies]
# Internal crates
sm-core = { path = "crates/sm-core" }
sm-store = { path = "crates/sm-store" }
sm-embed = { path = "crates/sm-embed" }
sm-spatial = { path = "crates/sm-spatial" }
sm-capture = { path = "crates/sm-capture" }
sm-share = { path = "crates/sm-share" }
sm-daemon = { path = "crates/sm-daemon" }

# sm-core
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = { version = "1.2.3", features = ["uuid1"] }
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["v7", "v8", "serde"] }
sha2 = "0.11.1"
toml = "1.2.1"
# `directories` 6.0.0 (SPEC 15) is not used: it brings `option-ext`, which is
# MPL-2.0. sm-core resolves the two folders itself (decision B-41).

# sm-store (SPEC 15: rusqlite 0.43 bundled; spike b: vec1 through cc)
rusqlite = { version = "=0.43.0", features = ["bundled"] }
libsqlite3-sys = { version = "=0.40.0", features = ["bundled"] }
cc = "=1.11.2"

# sm-embed (SPEC 15: ort 2.0.0-rc.15, tokenizers 0.23.2, fastembed 7.7.0 behind a feature)
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls", "api-24"] }
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
fastembed = { version = "=7.7.0" }
ndarray = "0.17.2"
num_cpus = "1.17.0"
# Model download over TLS (B-42). The same version ort-sys's build script uses,
# so the tree holds one ureq and one rustls.
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }

# sm-spatial (SPEC 7 and 15)
hdbscan = "=0.12.0"
holomap = "=0.3.0"

# sm-capture
regex = "1.13.1"

# sm-daemon and sm-cli (SPEC 15: interprocess 2.4.8, rmcp 3.10.0)
interprocess = "=2.4.8"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "process"] }
rmcp = { version = "=3.10.0", features = ["server", "client", "macros", "schemars", "transport-io", "transport-child-process"] }
libc = "0.2"
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Threading",
] }
# Command-line parsing for the `spatial-memory` binary (B-42)
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }

# Tests
tempfile = "3.27.0"

[workspace.lints.rust]
unused_must_use = "deny"
unreachable_pub = "allow"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# Dependencies are optimised even in test builds: the tokenizer and ONNX
# Runtime glue are unusably slow at opt-level 0, and the latency tests run
# through `cargo test`. The workspace's own crates stay at opt-level 0.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
