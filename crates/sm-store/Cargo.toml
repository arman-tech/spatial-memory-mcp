[package]
name = "sm-store"
description = "The SQLite system of record for Spatial Memory: schema and migrations, exact vector search through vec1, FTS5 keyword search, anchors, links, the map cache and backups."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
sm-core.workspace = true
rusqlite.workspace = true
# A direct dependency so that build.rs sees DEP_SQLITE3_INCLUDE, the bundled
# SQLite header vec1.c is compiled against (spike b).
libsqlite3-sys.workspace = true
serde_json.workspace = true

[build-dependencies]
cc.workspace = true

[dev-dependencies]
sm-core = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
