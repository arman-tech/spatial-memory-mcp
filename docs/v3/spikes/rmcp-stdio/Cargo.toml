[package]
name = "spike-rmcp-stdio"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
rmcp = { version = "=3.10.0", features = ["server", "client", "macros", "schemars", "transport-io", "transport-child-process"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process"] }

# Standalone: not a member of the repository workspace.
[workspace]
